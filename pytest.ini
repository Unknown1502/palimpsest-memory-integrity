[pytest]
# Without testpaths, a bare `pytest -q` from the repo root walks
# infrastructure/cdk.out/ (CDK bundles a full copy of every Lambda's
# dependencies, several of which ship their own test modules with
# colliding basenames) and dies with dozens of collection errors before
# reaching tests/. Both directories are gitignored, so a fresh clone is
# unaffected — but anyone who runs `cdk synth` before `pytest` would hit
# it, and README.md tells them to run exactly `pytest -q`.
testpaths = tests
norecursedirs = .venv infrastructure console node_modules cdk.out .git .pytest_cache
